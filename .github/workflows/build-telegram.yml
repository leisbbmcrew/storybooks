name: Crea libreria Telegram
# Si lancia a mano solo se serve ricompilare docs/telegram-lib.js (GitHub → Actions → «Crea libreria Telegram» → Run workflow).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compila
        run: |
          set -e
          mkdir -p build && cd build
          cat > package.json <<'JSON'
          {"name":"telegram-lib-build","private":true,"type":"module",
           "dependencies":{"telegram":"2.26.22","esbuild":"^0.23.0","esbuild-plugins-node-modules-polyfill":"^1.6.0"}}
          JSON
          cat > entry.js <<'JS'
          import * as tg from "telegram";
          export default tg;
          export const TelegramClient = tg.TelegramClient;
          export const Api = tg.Api;
          export const sessions = tg.sessions;
          export const helpers = tg.helpers;
          export const client = tg.client;
          export const errors = tg.errors;
          export const utils = tg.utils;
          export const events = tg.events;
          JS
          cat > build.mjs <<'JS'
          import { build } from "esbuild";
          import { nodeModulesPolyfillPlugin } from "esbuild-plugins-node-modules-polyfill";
          await build({
            entryPoints: ["entry.js"], bundle: true, format: "esm", platform: "browser", target: "es2020",
            outfile: "../docs/telegram-lib.js", minify: true, define: { global: "globalThis" },
            plugins: [nodeModulesPolyfillPlugin({ globals: { Buffer: true, process: true }, fallback: "empty" })],
            logLevel: "info"
          });
          JS
          npm install --no-audit --no-fund
          node build.mjs
          ls -l ../docs/telegram-lib.js
      - name: Salva nel repository
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add docs/telegram-lib.js
          git commit -m "Aggiorna telegram-lib.js" || echo "Nessuna modifica"
          git push
