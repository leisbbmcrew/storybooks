name: Prepara Kokoro
# Si lancia a mano una volta sola: GitHub → Actions → «Prepara Kokoro» → Run workflow.
# Compila la libreria delle voci Kokoro e la salva nel sito, nella cartella kokoro/.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kokoro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compila la libreria
        run: |
          set -e
          mkdir -p /tmp/k && cd /tmp/k
          npm init -y >/dev/null
          # --ignore-scripts: niente download di binari per Node (servono solo nel browser)
          npm install kokoro-js@^1.2.0 esbuild@^0.24.0 --ignore-scripts --no-audit --no-fund
          npm ls kokoro-js phonemizer @huggingface/transformers onnxruntime-web || true
          cat > entry.js <<'JS'
          export {KokoroTTS} from 'kokoro-js';
          export {phonemize} from 'phonemizer';
          export {env} from '@huggingface/transformers';
          JS
          cat > build.mjs <<'JS'
          import {build} from 'esbuild';
          // moduli di Node usati dalle librerie solo fuori dal browser: import statici → vuoti, dinamici → lasciati così
          const NODE=/^(node:)?(fs|fs\/promises|path|url|os|crypto|stream|stream\/web|util|module|worker_threads|child_process|http|https|zlib|buffer|events)$/;
          const stub={name:'stub-node',setup(b){
            b.onResolve({filter:NODE},a=>a.kind==='dynamic-import'?{path:a.path,external:true}:{path:a.path,namespace:'stub'});
            b.onLoad({filter:/.*/,namespace:'stub'},()=>({loader:'js',contents:'const s=new Proxy(function(){},{get:()=>()=>{}});export default s;export const fileURLToPath=u=>u,pathToFileURL=u=>u,join=(...a)=>a.join("/"),resolve=(...a)=>a.join("/"),dirname=p=>p,basename=p=>p,extname=()=>"",existsSync=()=>false,createRequire=()=>()=>({});'}));
          }};
          await build({entryPoints:['entry.js'],bundle:true,format:'esm',platform:'browser',target:'es2022',minify:true,outfile:'kokoro.bundle.js',plugins:[stub],logLevel:'info'});
          JS
          node build.mjs
          ls -l kokoro.bundle.js
          echo "--- onnxruntime-web"; find node_modules -type d -path '*onnxruntime-web/dist' | head
      - name: Copia i file nel sito e salva
        run: |
          set -e
          DEST=public; [ -f docs/index.html ] && DEST=docs
          mkdir -p "$DEST/kokoro/ort"
          cp /tmp/k/kokoro.bundle.js "$DEST/kokoro/kokoro.bundle.js"
          ORT=$(find /tmp/k/node_modules -type d -path '*onnxruntime-web/dist' | head -1)
          for f in "$ORT"/ort-wasm-simd-threaded*.wasm "$ORT"/ort-wasm-simd-threaded*.mjs; do
            [ -f "$f" ] && cp "$f" "$DEST/kokoro/ort/"
          done
          for f in kokoro.bundle.js ort/ort-wasm-simd-threaded.jsep.wasm; do
            test -s "$DEST/kokoro/$f" || { echo "Manca $f"; exit 1; }
          done
          ls -lR "$DEST/kokoro"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A "$DEST/kokoro"
          if git diff --cached --quiet; then echo "Nessuna modifica"; else git commit -m "Aggiunge i componenti Kokoro" && git push; fi
