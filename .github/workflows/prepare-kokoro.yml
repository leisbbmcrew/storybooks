name: Prepara Kokoro
# Si lancia a mano una volta sola: GitHub → Actions → «Prepara Kokoro» → Run workflow.
# Compila la libreria delle voci Kokoro e la salva nel sito, nella cartella kokoro/.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kokoro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compila la libreria
        run: |
          set -e
          mkdir -p /tmp/k && cd /tmp/k
          npm init -y >/dev/null
          npm install kokoro-js@1.2.1 esbuild@0.24.0 --no-audit --no-fund
          cat > entry.js <<'JS'
          export {KokoroTTS} from 'kokoro-js';
          export {phonemize} from 'phonemizer';
          export {env} from '@huggingface/transformers';
          JS
          npx esbuild entry.js --bundle --format=esm --platform=browser --target=es2022 --minify --outfile=kokoro.bundle.js
          ls -l kokoro.bundle.js
          echo "--- onnxruntime-web"; find node_modules -type d -path '*onnxruntime-web/dist' | head
      - name: Copia i file nel sito e salva
        run: |
          set -e
          DEST=public; [ -f docs/index.html ] && DEST=docs
          mkdir -p "$DEST/kokoro/ort"
          cp /tmp/k/kokoro.bundle.js "$DEST/kokoro/kokoro.bundle.js"
          ORT=$(find /tmp/k/node_modules -type d -path '*onnxruntime-web/dist' | head -1)
          for f in "$ORT"/ort-wasm-simd-threaded*.wasm "$ORT"/ort-wasm-simd-threaded*.mjs; do
            [ -f "$f" ] && cp "$f" "$DEST/kokoro/ort/"
          done
          for f in kokoro.bundle.js ort/ort-wasm-simd-threaded.jsep.wasm; do
            test -s "$DEST/kokoro/$f" || { echo "Manca $f"; exit 1; }
          done
          ls -lR "$DEST/kokoro"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A "$DEST/kokoro"
          if git diff --cached --quiet; then echo "Nessuna modifica"; else git commit -m "Aggiunge i componenti Kokoro" && git push; fi
