<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Storybooks</title>
<meta name="theme-color" content="#ffffff" id="tc">
<meta name="description" content="Audiolibri in italiano: carichi i tuoi libri e li ascolti con una bella voce.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Storybooks">
<script>try{var t=localStorage.getItem('sb_theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="./style.css">
</head><body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
 <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></symbol>
 <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v16h-4z"/><path d="M15.5 5.6l3.8-1 3 14.6-3.8 1z"/></symbol>
 <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></symbol>
 <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/></symbol>
 <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.4" height="15" rx="1.2" fill="currentColor" stroke="none"/><rect x="13.6" y="4.5" width="4.4" height="15" rx="1.2" fill="currentColor" stroke="none"/></symbol>
 <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M19 5.5L9 12l10 6.5z" fill="currentColor"/></symbol>
 <symbol id="i-next" viewBox="0 0 24 24"><path d="M18 5v14"/><path d="M5 5.5L15 12 5 18.5z" fill="currentColor"/></symbol>
 <symbol id="i-back" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></symbol>
 <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></symbol>
 <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
 <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
 <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
 <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
 <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.6" fill="currentColor" stroke="none"/></symbol>
 <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
 <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
 <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
 <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
 <symbol id="i-speed" viewBox="0 0 24 24"><path d="M4.5 18a8.5 8.5 0 1 1 15 0"/><path d="M12 13l4-4"/></symbol>
 <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
 <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
 <symbol id="i-phones" viewBox="0 0 24 24"><path d="M4 16v-4a8 8 0 0 1 16 0v4"/><path d="M4 15h3v5H5.5A1.5 1.5 0 0 1 4 18.5zM20 15h-3v5h1.5a1.5 1.5 0 0 0 1.5-1.5z"/></symbol>
</defs></svg>

<div id="boot" role="status" aria-live="polite"><div class="logo">storybooks</div><div class="bar"><i id="bootbar"></i></div><div class="st" id="bootst">Avvio…</div><button id="bootgo">Continua comunque</button></div>

<header class="top">
 <div class="logo">storybooks</div>
 <div class="acts">
  <label class="add" title="Aggiungi libri (EPUB, TXT, HTML, Markdown)"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg><span>Aggiungi</span><input id="file" type="file" multiple accept=".epub,.txt,.md,.html,.htm" hidden></label>
  <button id="tgout" class="led" data-s="busy" title="Telegram" aria-label="Stato Telegram"><i></i></button>
 </div>
</header>

<main id="main"></main>

<div class="mini" id="mini">
 <div class="mprog"><i id="mprog"></i></div>
 <div id="mcv" class="mcv"></div>
 <button class="mt" id="mt" aria-label="Apri il lettore"><b></b><small></small></button>
 <button id="mplay" class="mb" aria-label="Riproduci"></button>
 <button id="mx" class="mb mut" aria-label="Chiudi il lettore" title="Chiudi"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button>
</div>

<nav aria-label="Navigazione">
 <button data-v="home" class="on"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg>Home</button>
 <button data-v="search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>Cerca</button>
 <button data-v="lib"><svg class="ic" aria-hidden="true"><use href="#i-library"/></svg>Libreria</button>
 <button data-v="set"><svg class="ic" aria-hidden="true"><use href="#i-settings"/></svg>Impostazioni</button>
</nav>

<section class="pl" id="pl" role="dialog" aria-label="Lettore" aria-hidden="true">
 <div class="hd"><button id="close" aria-label="Riduci il lettore"><svg class="ic" aria-hidden="true"><use href="#i-chev"/></svg></button><span>In riproduzione</span><button id="pmenu" aria-label="Opzioni del libro"><svg class="ic" aria-hidden="true"><use href="#i-more"/></svg></button></div>
 <div id="pcv" class="big"></div>
 <h1 id="pt"></h1><div class="au" id="pa"></div><div class="chn" id="pch"></div>
 <div class="now" id="now"></div>
 <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posizione nel capitolo"><div class="lbl"><span id="l1"></span><span id="l2"></span></div>
 <div class="ctl">
  <button id="pc" title="Capitolo precedente" aria-label="Capitolo precedente"><svg class="ic" aria-hidden="true"><use href="#i-prev"/></svg></button>
  <button id="bk" title="Indietro" aria-label="Indietro"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg></button>
  <button class="play" id="pp" aria-label="Riproduci"></button>
  <button id="fw" title="Avanti" aria-label="Avanti"><svg class="ic" aria-hidden="true"><use href="#i-fwd"/></svg></button>
  <button id="nc" title="Capitolo successivo" aria-label="Capitolo successivo"><svg class="ic" aria-hidden="true"><use href="#i-next"/></svg></button>
 </div>
 <div class="row">
  <button id="sp"><svg class="ic" aria-hidden="true"><use href="#i-speed"/></svg><span>1×</span></button>
  <button id="sl"><svg class="ic" aria-hidden="true"><use href="#i-moon"/></svg><span>Timer</span></button>
  <button id="chs"><svg class="ic" aria-hidden="true"><use href="#i-list"/></svg><span>Capitoli</span></button>
  <button id="vo"><svg class="ic" aria-hidden="true"><use href="#i-mic"/></svg><span>Voce</span></button>
 </div>
</section>

<audio id="au" playsinline preload="auto"></audio>
<input id="afile" type="file" accept=".mp3,audio/mpeg" multiple hidden>
<div class="scrim" id="scrim"></div><div class="sheet" id="sheet" role="dialog"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="gen"><div id="gt"></div><div class="gb"><i id="gbar"></i></div><button id="gx">Annulla</button></div>
<div id="drop"><div>Rilascia qui i libri per aggiungerli</div></div>

<script src="./app.js"></script>
<script type="module" src="./storage.js"></script>
<script type="module" src="./piper.js"></script>
<script type="module" src="./kokoro.js"></script>
</body></html>
