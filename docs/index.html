<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Storybooks</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#6b6b6b;--card:#f3f1ee;--acc:#ff5a1f;--line:#e4e0db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#f4f2ef;--mut:#a09b95;--card:#1f1e1d;--line:#2d2b29;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--fg:#f4f2ef;--mut:#a09b95;--card:#1f1e1d;--line:#2d2b29;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.top{max-width:720px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:16px}
.logo{font-weight:800;font-size:24px;color:var(--acc);letter-spacing:-.5px}
.led{flex:none;width:30px;height:30px;padding:0;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.led i{display:block;width:13px;height:13px;border-radius:50%;background:var(--c,#E0A800);box-shadow:0 0 0 2px var(--bg),0 0 7px 1px var(--c,#E0A800)}.led[data-s=busy] i{animation:ledp 1s ease-in-out infinite}@keyframes ledp{50%{opacity:.35}}
.add{background:var(--acc);color:#fff;border-radius:20px;padding:8px 16px;font-weight:600;cursor:pointer}
main{max-width:720px;margin:auto;padding:0 16px 170px}
h2{font-size:18px;margin:22px 0 10px}
.shelf{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.card{flex:0 0 132px;cursor:pointer;position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.grid .card{flex:none}
.cv{aspect-ratio:1;border-radius:10px;color:#fff;padding:10px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;width:100%}
.cv .cvi{display:block;flex:1;min-height:0;width:100%;object-fit:contain}
.cv b{font-size:14px;line-height:1.15}.cv i{font-size:11px;opacity:.85}
.card p{margin:6px 0 0;font-weight:600;font-size:13px;line-height:1.2}.card small{color:var(--mut)}
.del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border-radius:50%;width:24px;height:24px;line-height:24px}
.hero{display:flex;gap:14px;background:var(--card);border-radius:16px;padding:12px;align-items:center;cursor:pointer}
.hero .cv{width:96px;flex:none}.hero div.t{flex:1;min-width:0}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px}.bar i{display:block;height:100%;background:var(--acc);border-radius:2px}
.empty{text-align:center;padding:48px 16px;color:var(--mut);border:2px dashed var(--line);border-radius:16px;margin-top:20px}
.empty b{display:block;color:var(--fg);font-size:18px;margin-bottom:6px}
input[type=search]{width:100%;padding:12px 16px;border-radius:24px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;padding:10px 0;font-size:11px;color:var(--mut)}nav button span{display:block;font-size:20px}nav .on{color:var(--acc)}
.mini{position:fixed;left:8px;right:8px;bottom:calc(58px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:12px;display:none;align-items:center;gap:10px;padding:8px;z-index:6;box-shadow:0 2px 12px rgba(0,0,0,.2);max-width:704px;margin:auto}
.mini .cv{width:42px;padding:3px;font-size:0}.mini .cv b,.mini .cv i{display:none}
.mini .t{flex:1;min-width:0;cursor:pointer}.mini .t b,.mini .t small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini small{color:var(--mut)}
.mini button{font-size:22px;width:44px;color:var(--acc)}
.pl{position:fixed;inset:0;background:var(--bg);z-index:20;transform:translateY(100%);transition:transform .3s;padding:calc(12px + env(safe-area-inset-top,0px)) 20px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:auto}
.pl.open{transform:none}
.pl .hd{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px}
.pl .hd button{font-size:26px}
.pl .big{width:min(64vw,300px);margin:12px auto}
.pl h1{font-size:20px;margin:6px 0 0;text-align:center}.pl .au{text-align:center;color:var(--mut)}
.now{margin:14px auto;max-width:560px;min-height:84px;text-align:center;font-size:17px;line-height:1.5;font-family:Georgia,serif}
input[type=range]{width:100%;accent-color:var(--acc)}
.lbl{display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
.ctl{display:flex;justify-content:center;align-items:center;gap:14px;margin:8px 0}
.ctl button{font-size:24px;width:48px;height:48px}
.ctl .play{background:var(--acc);color:#fff;border-radius:50%;width:68px;height:68px;font-size:28px}
.row{display:flex;justify-content:space-around;margin-top:auto;padding-top:10px}
.row button{font-size:13px;color:var(--mut);padding:8px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:29;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:70%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;z-index:30;display:none;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:720px;margin:auto}
.sheet h3{margin:0 0 8px}.sheet button.it{display:block;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.sheet .on{color:var(--acc);font-weight:700}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:50;display:none;font-size:13px}
</style></head>
<body>
<div class="top"><div class="logo">storybooks</div><div style="display:flex;align-items:center;gap:12px"><label class="add">+ Aggiungi libri<input id="file" type="file" multiple accept=".epub,.txt,.md,.html,.htm" hidden></label><button id="tgout" class="led" data-s="busy" title="Telegram" aria-label="Stato Telegram"><i></i></button></div></div>
<main id="main"></main>
<div class="mini" id="mini"><div id="mcv" style="width:42px"></div><div class="t" id="mt"><b></b><small></small></div><button id="mplay">▶</button></div>
<nav><button data-v="home" class="on"><span>⌂</span>Home</button><button data-v="search"><span>⌕</span>Cerca</button><button data-v="lib"><span>▤</span>Libreria</button></nav>
<div class="pl" id="pl">
 <div class="hd"><button id="close">⌄</button><span>In riproduzione</span><span style="width:26px"></span></div>
 <div id="pcv" class="big"></div><h1 id="pt"></h1><div class="au" id="pa"></div>
 <div class="now" id="now"></div>
 <input type="range" id="seek" min="0" max="1000" value="0"><div class="lbl"><span id="l1"></span><span id="l2"></span></div>
 <div class="ctl"><button id="pc" title="Capitolo precedente">⏮</button><button id="bk" title="Indietro">⟲</button><button class="play" id="pp">▶</button><button id="fw" title="Avanti">⟳</button><button id="nc" title="Capitolo successivo">⏭</button></div>
 <div class="row"><button id="sp">1×</button><button id="sl">☾ Timer</button><button id="chs">☰ Capitoli</button><button id="vo">🎙 Voce</button></div>
</div>
<div class="scrim" id="scrim"></div><div class="sheet" id="sheet"></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}
let books=[],db=null,cur=null,segs=[],si=0,ci=0,playing=false,tok=0,speed=+(ls('sb_speed')||1),voiceName=ls('sb_voice')||'',sleepT=null,sleepI=0,view='home',voices=[];
/* ---------- storage ---------- */
const sbReady=()=>window.SBTG?Promise.resolve():new Promise(r=>addEventListener('sbtg-load',r,{once:true}));
const dbPut=async b=>{await sbReady();return SBTG.put(b,p=>toast('Carico «'+b.title+'»… '+Math.round(p*100)+'%'))};
const dbGet=async id=>{await sbReady();return SBTG.get(id)};
const dbDel=async id=>{await sbReady();return SBTG.del(id)};
const prog=id=>{try{return JSON.parse(ls('sb_p_'+id))||{}}catch(e){return{}}};
function save(){if(cur)ls('sb_p_'+cur.id,JSON.stringify({ch:ci,si,pc:(ci+si/Math.max(1,segs.length))/cur.chapters.length}))}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',Math.max(2600,t.length*55))}
/* ---------- import ---------- */
const norm=s=>s.replace(/\s+/g,' ').trim();
function chunkText(txt){
  const ps=txt.replace(/\r/g,'').split(/\n+/).map(norm).filter(Boolean),chs=[];let c={t:'Parte 1',p:[]},n=0;
  const push=()=>{if(c.p.length)chs.push(c)};
  for(const p of ps){
    const isH=/^(capitolo|chapter|parte|libro)\b/i.test(p)&&p.length<70;
    if(isH||n>6000){if(c.p.length>(isH?0:0)){push();c={t:isH?p:'Parte '+(chs.length+1),p:[],};n=0}else if(isH)c.t=p}
    c.p.push(p);n+=p.length;
  }
  push();return chs;
}
async function parseEpub(f){
  const z=await JSZip.loadAsync(f),dp=new DOMParser(),rd=async p=>{const e=z.file(p);return e?e.async('string'):''};
  const cont=dp.parseFromString(await rd('META-INF/container.xml'),'application/xml');
  const opfP=cont.querySelector('rootfile').getAttribute('full-path'),dir=opfP.replace(/[^/]*$/,'');
  const opf=dp.parseFromString(await rd(opfP),'application/xml');
  const g=t=>{const e=opf.getElementsByTagName(t)[0];return e?norm(e.textContent):''};
  const man={};[...opf.getElementsByTagName('item')].forEach(i=>man[i.getAttribute('id')]=i.getAttribute('href'));
  const chs=[];let k=0;
  for(const r of opf.getElementsByTagName('itemref')){
    const h=man[r.getAttribute('idref')];if(!h)continue;
    const parts=(dir+decodeURIComponent(h.split('#')[0])).split('/'),path=[];
    parts.forEach(x=>x==='..'?path.pop():x!=='.'&&path.push(x));
    const d=dp.parseFromString(await rd(path.join('/')),'text/html');
    d.querySelectorAll('script,style,sup.noteref').forEach(e=>e.remove());
    const ps=[...d.querySelectorAll('p,h1,h2,h3,h4,h5,h6,li')].map(e=>norm(e.textContent)).filter(Boolean);
    if(ps.join(' ').length<150)continue;
    const hd=d.querySelector('h1,h2,h3');k++;
    chs.push({t:hd?norm(hd.textContent).slice(0,70):'Capitolo '+k,p:ps});
  }
  let embedded=null;
  try{
    const it=[...opf.getElementsByTagName('item')],img=i=>/^image\//.test(i.getAttribute('media-type')||'');
    const meta=[...opf.getElementsByTagName('meta')].find(m=>m.getAttribute('name')==='cover');
    const e=it.find(i=>(i.getAttribute('properties')||'').split(/\s+/).includes('cover-image'))||(meta&&it.find(i=>i.getAttribute('id')===meta.getAttribute('content')&&img(i)))||it.find(i=>/cover/i.test((i.getAttribute('id')||'')+(i.getAttribute('href')||''))&&img(i));
    if(e){
      const pp=[];(dir+decodeURIComponent(e.getAttribute('href').split('#')[0])).split('/').forEach(x=>x==='..'?pp.pop():x!=='.'&&pp.push(x));
      const zf=z.file(pp.join('/'));if(zf)embedded=new Blob([await zf.async('uint8array')],{type:e.getAttribute('media-type')||'image/jpeg'});
    }
  }catch(e){}
  return{title:g('dc:title'),author:g('dc:creator'),chapters:chs,embedded};
}
async function addFile(f){
  const ext=f.name.split('.').pop().toLowerCase(),base=f.name.replace(/\.[^.]+$/,'');
  let b;
  try{
    if(ext==='epub')b=await parseEpub(f);
    else{
      let t=await f.text();
      if(ext==='html'||ext==='htm'){const d=new DOMParser().parseFromString(t,'text/html');t=[...d.querySelectorAll('p,h1,h2,h3,li')].map(e=>e.textContent).join('\n')}
      b={title:base,author:'',chapters:chunkText(t)};
    }
    if(!b.chapters.length)throw new Error('vuoto');
    b.title=b.title||base;b.id='b'+Date.now()+Math.random().toString(36).slice(2,6);b.added=Date.now();
    await dbPut(b);books.push(b);toast('Aggiunto: '+b.title+' · cerco la copertina…');
    try{const src=await SBTG.cover(b,b.embedded);toast(src?(src==='epub'?'Copertina presa dall’EPUB':'Copertina trovata su '+src):'Nessuna copertina trovata: ne riproverò più tardi');render()}
    catch(e){toast('Libro aggiunto, copertina non salvata: '+e.message)}
  }catch(e){toast('Errore con «'+f.name+'»: '+e.message)}
}
$('#file').onchange=async e=>{for(const f of e.target.files)await addFile(f);e.target.value='';render()};
/* ---------- UI ---------- */
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const covers={};   /* id libro → indirizzo locale della copertina */
const cover=(b,x='')=>{const h=hue(b.title),bg=`linear-gradient(145deg,hsl(${h} 60% 42%),hsl(${(h+40)%360} 65% 26%))`;
  if(covers[b.id])return `<div class="cv ${x}" style="background:${bg};padding:0"><img class="cvi" src="${covers[b.id]}" alt="${esc(b.title)}"></div>`;
  return `<div class="cv ${x}" style="background:${bg}"><b>${esc(b.title)}</b><i>${esc(b.author||'')}</i></div>`};
const card=(b,d)=>`<div class="card" data-id="${b.id}">${cover(b)}<p>${esc(b.title)}</p><small>${esc(b.author||'Autore sconosciuto')}</small>${d?'<button class="del" data-del="'+b.id+'">×</button>':''}</div>`;
const emptyBox=`<div class="empty"><b>La tua libreria è vuota</b>Tocca «Aggiungi libri» e carica file EPUB, TXT, HTML o Markdown.<br>Compariranno qui e potrai ascoltarli subito.</div>`;
function render(){
  const m=$('#main');
  if(view==='home'){
    const last=books.find(b=>b.id===ls('sb_last')),rec=[...books].sort((a,b)=>b.added-a.added);
    m.innerHTML=(last?`<h2>Continua ad ascoltare</h2><div class="hero" data-id="${last.id}">${cover(last)}<div class="t"><b>${esc(last.title)}</b><br><small style="color:var(--mut)">${esc(last.author||'')}</small><div class="bar"><i style="width:${Math.round((prog(last.id).pc||0)*100)}%"></i></div></div></div>`:'')+
    (books.length?`<h2>Aggiunti di recente</h2><div class="shelf">${rec.map(b=>card(b)).join('')}</div>`:emptyBox);
  }else if(view==='search'){
    m.innerHTML=`<input type="search" id="q" placeholder="Cerca titoli e autori"><div class="grid" id="res" style="margin-top:16px"></div>`;
    const f=()=>{const q=$('#q').value.toLowerCase();$('#res').innerHTML=books.filter(b=>(b.title+' '+b.author).toLowerCase().includes(q)).map(b=>card(b)).join('')};
    $('#q').oninput=f;f();
  }else{
    m.innerHTML=`<h2>La mia libreria</h2>`+(books.length?`<div class="grid">${books.map(b=>card(b,1)).join('')}</div>`:emptyBox);
  }
}
$('#main').onclick=async e=>{
  const d=e.target.closest('[data-del]');
  if(d){e.stopPropagation();const id=d.dataset.del;if(cur&&cur.id===id){pause();cur=null;$('#mini').style.display='none'}books=books.filter(b=>b.id!==id);await dbDel(id);render();return}
  const c=e.target.closest('[data-id]');if(c)openBook(c.dataset.id);
};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render()});
/* ---------- text → speech segments (intonation / paraverbal) ---------- */
const clean=s=>s.replace(/[«»“”"*_]/g,'').replace(/^[\s—–-]+/,'').replace(/\s[—–]\s?/g,', ').replace(/\s+/g,' ').trim();
const MAXC=190,MINC=70;   /* un brano = 1-3 frasi (≈70-190 caratteri), mai a cavallo di due paragrafi */
function splitLong(t){   /* frasi molto lunghe: si spezza alle virgole, poi agli spazi */
  if(t.length<=MAXC)return[t];
  const out=[];let a='';
  for(const x of t.split(/(?<=[,;:])\s+/)){
    if(a&&(a+' '+x).length>MAXC){out.push(a);a=''}
    a=a?a+' '+x:x;
    while(a.length>MAXC){let k=a.lastIndexOf(' ',MAXC);if(k<40)k=MAXC;out.push(a.slice(0,k));a=a.slice(k).trim()}
  }
  if(a)out.push(a);return out;
}
function buildSegs(ch){
  const out=[];let bal=0;
  const prosody=(t,dlg)=>{   /* intonazione dalla punteggiatura finale e dai dialoghi */
    const end=t.replace(/["»”’)\s]+$/,'').slice(-1);let r=1,p=dlg?1.1:.97;
    if(end==='?')p+=.14;else if(end==='!'){p+=.1;r=1.07}else if(end==='…'||/\.\.\.$/.test(t)){r=.88;p-=.05}
    if(dlg)r*=1.03;return{r,p};
  };
  ch.p.forEach((para,pi)=>{
    const head=pi===0&&ch.p.length>1&&para.length<90&&!/[.!?…]$/.test(para);
    if(head){const c=clean(para);if(c)out.push({d:para,t:c,r:.9,p:.94});return}
    const ss=para.match(/[^.!?…]+(?:[.!?…]+["»”’)]*|$)\s*/g)||[para];
    let buf='',bdlg=false;
    const flush=()=>{const c=clean(buf);if(c){const q=prosody(buf.trim(),bdlg);out.push({d:buf.trim(),t:c,r:q.r,p:q.p})}buf=''};
    ss.forEach(x=>{
      const t=x.trim();if(!/[\p{L}\p{N}]/u.test(t))return;
      const open=/^[«“"—–-]/.test(t),was=bal>0;
      bal=Math.max(0,bal+(t.match(/[«“]/g)||[]).length-(t.match(/[»”]/g)||[]).length);
      const dlg=open||was;
      if(buf&&dlg!==bdlg)flush();            /* si cambia tono tra narrazione e dialogo */
      for(const piece of splitLong(t)){
        if(buf&&(buf+' '+piece).length>MAXC)flush();
        if(!buf)bdlg=dlg;
        buf=buf?buf+' '+piece:piece;
        if(buf.length>=MINC)flush();
      }
    });
    flush();
  });
  return out.length?out:[{d:'…',t:'…',r:1,p:1}];
}
/* ---------- speech engine ---------- */
const qual=v=>{const n=v.name+' '+(v.voiceURI||'');let q=0;
  if(/natural|neural/i.test(n))q+=6;if(/premium|enhanced|migliorat|potenziat/i.test(n))q+=5;
  if(/siri/i.test(n))q+=4;if(/google/i.test(n))q+=3;if(v.localService===false)q+=1;
  if(/elsa|isabella|diego|giuseppe|alice|federica|luca|paola|emma/i.test(n))q+=1;
  if(/compact|eloquence|espeak/i.test(n))q-=3;return q};
function loadVoices(){voices=(speechSynthesis.getVoices()||[]).filter(v=>/^it/i.test(v.lang.replace('_','-'))).sort((a,b)=>qual(b)-qual(a)||a.name.localeCompare(b.name))}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices}catch(e){}
const pickVoice=()=>voices.find(v=>v.name===voiceName)||voices[0]||null;
/* Lettura continua: i prossimi brani vengono messi in coda al sintetizzatore mentre il corrente è in corso,
   così la voce non aspetta e non ricarica nulla a ogni punteggiatura. I capitoli si susseguono da soli. */
const LOOK=3,clampR=x=>Math.min(2,Math.max(.5,x)),clampP=x=>Math.min(2,Math.max(0,x));
let pend=0,qc=0,qi=0,qs=[],ka=0;
function enqueue(my,v,c,i,arr){
  const g=arr[i],u=new SpeechSynthesisUtterance(g.t);
  u.lang='it-IT';if(v)u.voice=v;
  u.rate=clampR(g.r*speed);u.pitch=clampP(g.p);
  pend++;
  u.onstart=()=>{if(my!==tok)return;if(c!==ci){ci=c;segs=arr}si=i;if(i%4===0)save();ui()};
  u.onend=()=>{pend--;if(my===tok)feed(my)};
  u.onerror=e=>{pend--;if(my!==tok||e.error==='interrupted'||e.error==='canceled')return;feed(my)};
  speechSynthesis.speak(u);
}
function feed(my){
  if(my!==tok||!playing)return;
  const v=pickVoice();
  while(pend<LOOK){
    if(qi>=qs.length){if(qc+1>=cur.chapters.length)break;qc++;qs=buildSegs(cur.chapters[qc]);qi=0}
    enqueue(my,v,qc,qi,qs);qi++;
  }
  if(pend===0&&qi>=qs.length&&qc+1>=cur.chapters.length)pause();   /* fine del libro */
}
/* alcune voci online di Chrome si interrompono dopo ~15 s: un "respiro" ogni 10 s le tiene vive */
function keepAlive(v){clearInterval(ka);ka=0;
  if(v&&v.localService===false&&/google/i.test(v.name)&&!/android/i.test(navigator.userAgent))
    ka=setInterval(()=>{if(speechSynthesis.speaking&&!speechSynthesis.paused){speechSynthesis.pause();speechSynthesis.resume()}},10000)}
function play(){if(!cur)return;if(!('speechSynthesis' in window)){toast('Questo browser non supporta la sintesi vocale');return}speechSynthesis.cancel();playing=true;const my=++tok;pend=0;qc=ci;qs=segs;qi=si;keepAlive(pickVoice());ui();setTimeout(()=>feed(my),60)}
function pause(){playing=false;tok++;pend=0;clearInterval(ka);ka=0;try{speechSynthesis.cancel()}catch(e){}save();ui()}
function loadCh(i,s){ci=i;segs=buildSegs(cur.chapters[i]);si=Math.max(0,Math.min(s,segs.length-1))}
function jump(i,s){const was=playing;tok++;pend=0;try{speechSynthesis.cancel()}catch(e){}loadCh(i,s);save();was?play():ui()}
async function openBook(id){
  const b=books.find(x=>x.id===id);if(!b)return;
  if(!b.chapters){toast('Scarico il libro…');try{b.chapters=(await dbGet(id)).chapters}catch(e){return toast('Errore di download: '+e.message)}}
  if(cur&&cur.id!==id){pause()}
  if(!cur||cur.id!==id){cur=b;const p=prog(id);loadCh(Math.min(p.ch||0,b.chapters.length-1),p.si||0);ls('sb_last',id)}
  $('#pl').classList.add('open');play();
}
function ui(){
  if(!cur)return;
  $('#mini').style.display='flex';
  $('#mcv').innerHTML=cover(cur);$('#mt').innerHTML=`<b>${esc(cur.title)}</b><small>${esc(cur.chapters[ci].t)}</small>`;
  $('#pcv').innerHTML=cover(cur);$('#pt').textContent=cur.title;$('#pa').textContent=cur.author||'';
  const g=segs[si]||segs[segs.length-1];$('#now').textContent=g?g.d:'';
  $('#seek').value=Math.round(1000*si/Math.max(1,segs.length-1));
  $('#l1').textContent=`${ci+1}/${cur.chapters.length} · ${cur.chapters[ci].t.slice(0,30)}`;
  $('#l2').textContent=Math.round(100*(ci+si/Math.max(1,segs.length))/cur.chapters.length)+'% del libro';
  $('#pp').textContent=$('#mplay').textContent=playing?'❚❚':'▶';
  $('#sp').textContent=speed+'×';
}
$('#pp').onclick=$('#mplay').onclick=()=>playing?pause():play();
$('#mt').onclick=()=>$('#pl').classList.add('open');
$('#close').onclick=()=>$('#pl').classList.remove('open');
$('#seek').onchange=e=>jump(ci,Math.round(e.target.value/1000*(segs.length-1)));
$('#bk').onclick=()=>jump(ci,si-4);$('#fw').onclick=()=>jump(ci,si+4);
$('#pc').onclick=()=>jump(Math.max(0,si>3?ci:ci-1),0);
$('#nc').onclick=()=>ci+1<cur.chapters.length&&jump(ci+1,0);
$('#sp').onclick=()=>{const l=[.8,.9,1,1.1,1.25,1.5];speed=l[(l.indexOf(speed)+1)%l.length];ls('sb_speed',speed);if(playing)jump(ci,si);else ui()};
$('#sl').onclick=()=>{const l=[0,15,30,60];sleepI=(sleepI+1)%4;clearTimeout(sleepT);const m=l[sleepI];
  $('#sl').textContent=m?`☾ ${m} min`:'☾ Timer';if(m){sleepT=setTimeout(()=>{pause();$('#sl').textContent='☾ Timer';sleepI=0;toast('Timer scaduto: buonanotte')},m*60000)}};
function sheet(h){$('#sheet').innerHTML=h;$('#sheet').style.display='block';$('#scrim').style.display='block'}
$('#scrim').onclick=()=>{$('#sheet').style.display=$('#scrim').style.display='none'};
$('#chs').onclick=()=>{sheet('<h3>Capitoli</h3>'+cur.chapters.map((c,i)=>`<button class="it ${i===ci?'on':''}" data-c="${i}">${i+1}. ${esc(c.t)}</button>`).join(''));
  $('#sheet').onclick=e=>{const b=e.target.closest('[data-c]');if(b){$('#scrim').click();jump(+b.dataset.c,0)}}};
const vTag=v=>/natural|neural/i.test(v.name)?'★ Neurale · online':/premium|enhanced|migliorat|potenziat/i.test(v.name)?'★ Alta qualità':v.localService===false?'Online':'Sul dispositivo';
function vTips(){
  const u=navigator.userAgent;
  const t=/iPhone|iPad/i.test(u)?'Su iPhone/iPad: Impostazioni → Accessibilità → Contenuto letto → Voci → Italiano, e scarica le voci «Premium» o «Avanzata» (per esempio Alice, Federica, Luca). Poi riapri questa pagina.'
   :/Android/i.test(u)?'Su Android: Impostazioni → Sintesi vocale (o «Servizi vocali di Google») → installa le voci italiane di qualità alta e scegli la migliore. Poi riapri questa pagina.'
   :/Edg\//.test(u)?'In Edge compaiono le voci «Online (Natural)» di Microsoft (Elsa, Diego, Isabella e altre): sono tra le più realistiche e non richiedono installazioni.'
   :/Mac/i.test(u)?'Su Mac: Impostazioni → Accessibilità → Contenuto letto → Voce di sistema → Gestisci voci → Italiano, e scarica le voci «Premium». Con Edge trovi anche le voci «Online (Natural)».'
   :'Per voci molto più naturali apri questa pagina con Microsoft Edge: offre le voci «Online (Natural)» (Elsa, Diego, Isabella e altre) senza installare nulla.';
  return '<p style="color:var(--mut);font-size:12px;line-height:1.45">'+t+'</p>';
}
function sample(){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Buonasera. Questa è la mia voce: ti leggerò il libro con calma, fermandomi quando serve.');u.lang='it-IT';const v=pickVoice();if(v)u.voice=v;u.rate=clampR(speed);speechSynthesis.speak(u)}catch(e){}}
$('#vo').onclick=()=>{loadVoices();const cv=pickVoice();
  sheet('<h3>Voce di lettura</h3>'+(voices.length?voices.map(v=>`<button class="it ${cv&&v.name===cv.name?'on':''}" data-v="${esc(v.name)}">${esc(v.name)}<br><small style="color:var(--mut)">${vTag(v)}</small></button>`).join('')+vTips():'<p>Nessuna voce italiana trovata sul dispositivo.</p>'+vTips()));
  $('#sheet').onclick=e=>{const b=e.target.closest('[data-v]');if(b){voiceName=b.dataset.v;ls('sb_voice',voiceName);$('#scrim').click();if(playing)jump(ci,si);else sample()}}};
(async()=>{await sbReady();books=SBTG.cached();render();try{books=await SBTG.list()}catch(e){toast('Catalogo non raggiungibile: '+e.message)}render()})();
$('#tgout').onclick=async()=>{await sbReady();SBTG.menu()};
let rt=0;addEventListener('sbtg-cover',e=>{covers[e.detail.id]=e.detail.url;clearTimeout(rt);rt=setTimeout(()=>{render();if(cur&&$('#pcv')&&covers[cur.id]){$('#pcv').innerHTML=cover(cur);$('#mcv').innerHTML=cover(cur)}},150)});
addEventListener('sbtg-catalog',e=>{const old=new Map(books.map(b=>[b.id,b]));books=e.detail.map(b=>{const o=old.get(b.id);return o&&o.chapters?{...b,chapters:o.chapters}:b});render()});
</script>
<script type="module" src="./storage.js"></script>
</body></html>
